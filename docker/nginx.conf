# El sitio se sirve por HTTPS a través de Cloudflare, que termina el TLS y
# reenvía por HTTP al contenedor. Si un proxy delante (cloudflared) ya envió
# X-Forwarded-Proto, lo respetamos; si no (p.ej. acceso directo por HTTP en
# local), usamos el esquema real. Así el backend (Express trust proxy) sabe
# cuándo la conexión del usuario es segura y cookie-session emite la cookie de
# sesión httpOnly+Secure.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://archivo-oasis-api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
